<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ISP Speed Logger</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --surface: #ffffff;
      --surface-2: #f0f2f5;
      --border: #e3e6ea;
      --text: #14171c;
      --muted: #6b7380;
      --accent: #3b6ef6;
      --accent-text: #ffffff;
      --down: #0f9d78;
      --up: #7c5cf0;
      --ping: #e08a12;
      --danger: #d6455d;
      --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0e1013;
      --surface: #16191e;
      --surface-2: #1d2127;
      --border: #272c34;
      --text: #eceff3;
      --muted: #8b94a1;
      --accent: #5b8cff;
      --accent-text: #0b1020;
      --down: #34d3a4;
      --up: #a48bff;
      --ping: #f5b13d;
      --danger: #ff6b83;
      --shadow: none;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      width: 440px;
      padding: 14px;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.45 "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .brand { display: flex; align-items: center; gap: 9px; }
    .logo {
      width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
      background: linear-gradient(135deg, var(--accent), var(--up)); color: #fff;
    }
    .logo svg { width: 16px; height: 16px; }
    h1 { font-size: 15px; font-weight: 650; margin: 0; letter-spacing: -.01em; }
    .sub { font-size: 11px; color: var(--muted); }

    .icon-btn {
      width: 30px; height: 30px; padding: 0; display: grid; place-items: center;
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      color: var(--muted); cursor: pointer; box-shadow: var(--shadow);
    }
    .icon-btn:hover { color: var(--text); }
    .icon-btn svg { width: 16px; height: 16px; }
    :root:not([data-theme="dark"]) .i-sun { display: none; }
    :root[data-theme="dark"] .i-moon { display: none; }

    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stat {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 10px 12px; box-shadow: var(--shadow); position: relative; overflow: hidden;
    }
    .stat::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--c); }
    .stat .k { font-size: 11px; color: var(--muted); font-weight: 550; text-transform: uppercase; letter-spacing: .05em; }
    .stat .v { font-size: 22px; font-weight: 650; letter-spacing: -.02em; line-height: 1.2; margin-top: 2px; font-variant-numeric: tabular-nums; }
    .stat .u { font-size: 11px; color: var(--muted); font-weight: 500; margin-left: 2px; }
    .stat.down { --c: var(--down); } .stat.up { --c: var(--up); } .stat.ping { --c: var(--ping); }
    .meta { margin: 8px 2px 0; font-size: 11px; color: var(--muted); min-height: 1.4em; }

    .actions { display: flex; gap: 8px; margin-top: 10px; }
    button { font: inherit; cursor: pointer; }
    .btn {
      padding: 8px 12px; border-radius: 9px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text); font-weight: 550; box-shadow: var(--shadow);
      transition: background .12s, border-color .12s, transform .05s;
    }
    .btn:hover { background: var(--surface-2); }
    .btn:active { transform: translateY(1px); }
    .btn.primary { flex: 1; background: var(--accent); border-color: transparent; color: var(--accent-text); }
    .btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
    .btn.primary[disabled] { opacity: .6; cursor: progress; }
    .btn.danger { color: var(--danger); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .card {
      margin-top: 12px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; box-shadow: var(--shadow); overflow: hidden;
    }
    .card > summary, .card > .head {
      list-style: none; padding: 10px 14px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between;
    }
    .card > summary::-webkit-details-marker { display: none; }
    .card > summary::after {
      content: ""; width: 7px; height: 7px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
      transform: rotate(45deg); transition: transform .15s; margin-right: 3px;
    }
    .card[open] > summary::after { transform: rotate(-135deg); }
    .card > .head { cursor: default; }
    .body { padding: 2px 14px 14px; }

    label { display: block; margin-top: 10px; font-weight: 550; }
    label small { display: block; color: var(--muted); font-weight: 400; font-size: 11px; margin-top: 1px; }
    input {
      width: 100%; margin-top: 5px; padding: 8px 10px; font: inherit; color: var(--text);
      background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
    }
    input::placeholder { color: var(--muted); opacity: .7; }
    input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
    .row { display: flex; gap: 8px; margin-top: 14px; }

    table { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
    th { text-align: left; font-size: 10.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: 6px 10px; background: var(--surface-2); }
    td { padding: 7px 10px; border-top: 1px solid var(--border); white-space: nowrap; }
    td.err { color: var(--danger); white-space: normal; }
    .num-down { color: var(--down); font-weight: 600; } .num-up { color: var(--up); font-weight: 600; } .num-ping { color: var(--ping); font-weight: 600; }
    .empty { padding: 18px; text-align: center; color: var(--muted); }
    .count { font-weight: 400; color: var(--muted); font-size: 11px; }
    .toolbar { display: flex; gap: 6px; }
    .btn.sm { padding: 4px 9px; font-size: 11.5px; border-radius: 7px; box-shadow: none; }

    .pulse { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-right: 6px; animation: pulse 1.1s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .25; } }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15a9 9 0 0 1 18 0"/><path d="M12 15l4-5"/></svg>
      </div>
      <div>
        <h1>ISP Speed Logger</h1>
        <div class="sub" id="server">No tests yet</div>
      </div>
    </div>
    <button class="icon-btn" id="theme" title="Toggle light / dark" aria-label="Toggle light or dark theme">
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <section class="stats" aria-label="Latest result">
    <div class="stat down"><div class="k">Download</div><div class="v"><span id="s-down">–</span><span class="u">Mbps</span></div></div>
    <div class="stat up"><div class="k">Upload</div><div class="v"><span id="s-up">–</span><span class="u">Mbps</span></div></div>
    <div class="stat ping"><div class="k">Ping</div><div class="v"><span id="s-ping">–</span><span class="u">ms</span></div></div>
  </section>
  <div class="meta" id="status"></div>

  <div class="actions">
    <button class="btn primary" id="run">Run test now</button>
    <button class="btn" id="csv">Export CSV</button>
  </div>

  <details class="card" id="settings">
    <summary>Settings</summary>
    <div class="body">
      <label>Name / location label
        <small>Shows up in the shared sheet</small>
        <input id="label" placeholder="e.g. John – living room">
      </label>
      <label>Test every (minutes)
        <small>Each test uses data; 30+ recommended</small>
        <input id="interval" type="number" min="1" value="30">
      </label>
      <label>Google Sheet webhook URL <span class="count">(optional)</span>
        <input id="webhook" placeholder="https://script.google.com/macros/s/…/exec">
      </label>
      <label>Shared secret token
        <small>Must match the Apps Script</small>
        <input id="token" autocomplete="off">
      </label>
      <div class="row">
        <button class="btn primary" id="save">Save</button>
      </div>
    </div>
  </details>

  <section class="card">
    <div class="head">
      <span>History <span class="count" id="count"></span></span>
      <div class="toolbar"><button class="btn sm danger" id="clear">Clear</button></div>
    </div>
    <table>
      <thead><tr><th>Time</th><th>Down</th><th>Up</th><th>Ping</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden>No results yet. Run a test to get started.</div>
  </section>

  <script src="popup.js"></script>
</body>
</html>
